services:
  boutique-liberation:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boutique-liberation-local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5001}:5001"
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-this-local-secret-before-use}
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5001
      FLASK_DEBUG: "0"
      DB_PATH: /app/data/boutique_liberation.db
    volumes:
      - boutique_data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5001/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  boutique_data:
